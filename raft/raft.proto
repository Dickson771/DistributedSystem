syntax = "proto3";

package raft;

message LogEntry {
  uint64 term = 1;
  uint64 index = 2;
  string command = 3;
}

message AppendEntriesRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
  bool heartbeat = 7;
  string leader_address = 8;
  string leader_http_address = 9;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
  uint64 last_log_index = 4;
  string message = 5;
}

message RequestVoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message ClientCommandRequest {
  string client_id = 1;
  string payload = 2;
}

message ClientCommandResponse {
  bool accepted = 1;
  string leader_id = 2;
  string leader_http_address = 3;
  uint64 log_index = 4;
  uint64 commit_index = 5;
  string message = 6;
}

service RaftService {
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc ClientCommand(ClientCommandRequest) returns (ClientCommandResponse);
}
