version: "3.9"

services:
  node1:
    build: .
    container_name: consensus-node1
    environment:
      - NODE_ID=node1
      - ADDRESS=0.0.0.0:50051
      - PEERS=node1=consensus-node1:50051,node2=consensus-node2:50052,node3=consensus-node3:50053,node4=consensus-node4:50054,node5=consensus-node5:50055
      - ALLOW_COMMIT=true
    ports:
      - "50051:50051"

